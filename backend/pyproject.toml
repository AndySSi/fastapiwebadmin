[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiofiles==23.1.0",
    "alembic==1.13.1",
    "anyio==3.6.2",
    "async-timeout==4.0.3",
    "asyncmy==0.2.7",
    "celery==5.2.7",
    "certifi==2022.12.7",
    "charset-normalizer==3.0.1",
    "click==8.1.3",
    "colorama==0.4.6",
    "cryptography==40.0.2",
    "fastapi==0.111.0",
    "fastapi-limiter==0.1.6",
    "gevent==22.10.2",
    "greenlet==2.0.2",
    "gunicorn==20.1.0",
    "h11==0.14.0",
    "httpx==0.25.2",
    "idna==3.4",
    "loguru==0.6.0",
    "markupsafe==2.1.2",
    "orjson==3.8.6",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pycryptodomex>=3.23.0",
    "pydantic==2.7.3",
    "pydantic-settings==2.0.3",
    "pymysql==1.0.2",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "python-dotenv==1.0.0",
    "python-jose[cryptography]==3.3.0",
    "redis==5.0.4",
    "requests==2.28.2",
    "sniffio==1.3.0",
    "sqlalchemy==2.0.3",
    "typer==0.12.3",
    "urllib3==1.26.14",
    "uvicorn==0.20.0",
]
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff]
# 行宽,和 black 默认一致
line-length = 100
# 目标 Python 版本(根据你的项目调整)
target-version = "py312"

# 排除目录(默认就排除 .venv 等,这里可以追加)
extend-exclude = [
    "migrations",
    "build",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes
    "I",    # isort(整理 import)
    "B",    # bugbear(常见 bug)
    "C4",   # comprehensions(推导式优化)
    "UP",   # pyupgrade(用新语法)
    "SIM",  # simplify(简化代码)
    "RUF",  # ruff 自己的规则
]
# 忽略的规则
ignore = [
    "E501",  # 行太长(让 formatter 处理)
]

[tool.ruff.lint.per-file-ignores]
# 对特定文件放宽规则
"__init__.py" = ["F401"]     # 允许未使用的 import
"tests/*" = ["S101"]         # 测试里允许 assert

[tool.ruff.format]
# 字符串引号风格:double / single / preserve
quote-style = "double"
# 缩进:space / tab
indent-style = "space"
# 行尾:auto / lf / cr / crlf(WSL 推荐 lf)
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]
